<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu Hình PC Gaming</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas for Image Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap');

        body {
            font-family: 'Oswald', sans-serif;
            background-color: #120921;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .neon-text {
            text-shadow: 0 0 5px #d946ef, 0 0 10px #d946ef;
        }

        input, textarea {
            background: transparent;
            border: 1px dashed transparent;
            width: 100%;
            color: inherit;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus, input:hover, textarea:focus, textarea:hover {
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        /* Ẩn scrollbar cho đẹp */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a0b2e; }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [components, setComponents] = useState([
                { id: 1, type: 'CPU', name: 'Intel Core i5-14600K', price: '4.127.500', img: 'image/cpu.jpg' },
                { id: 2, type: 'MAINBOARD', name: 'Asus TUF GAMING B760M-PLUS WIFI DDR4', price: '2.800.000', img: 'image/mainboard.jpg' },
                { id: 3, type: 'RAM', name: 'RAM PC Kingbank 16GB DDR4 3200 White x2', price: '4.305.600', img: 'image/ram.jpg' },
                { id: 4, type: 'TẢN NHIỆT', name: 'Tản CPU Thermalright ps 120se', price: '700.000', img: 'image/cooler.jpg' },
                { id: 5, type: 'CARD ĐỒ HỌA', name: 'AMD Radeon RX 7600 Gigabyte GAMING OC', price: '6.800.000', img: 'image/vga.jpg' },
                { id: 6, type: 'Ổ CỨNG (SSD)', name: 'SSD Biwin NV7200 1TB M.2 PCIe Gen4 x4', price: '2.700.000', img: 'image/ssd.jpg' },
                { id: 7, type: 'NGUỒN (PSU)', name: 'DARKFLASH PMT750 GOLD', price: '1.400.000', img: 'image/psu.jpg' },
                { id: 8, type: 'VỎ CASE', name: 'Case Xigmatek Gaming X II 3F', price: '360.000', img: 'image/case.jpg' },
                { id: 9, type: 'QUẠT CASE', name: '3 fan case', price: '80.000', img: 'image/fan.jpg' }
            ]);

            const [peripherals, setPeripherals] = useState([
                { id: 'p1', type: 'MÀN HÌNH', name: 'LG 25G523B-B (UltraGear G5 25 inch, FHD 200Hz)', price: '2.000.000', img: 'image/monitor.jpg' },
                { id: 'p2', type: 'BÀN PHÍM', name: 'Bàn phím E-Dra', price: '500.000', img: 'image/keyboard.jpg' },
                { id: 'p3', type: 'CHUỘT', name: 'Razer DeathAdder V2 X HyperSpeed', price: '690.000', img: 'image/mouse.jpg' }
            ]);

            const [mainImg, setMainImg] = useState('image/main_pc.jpg');
            const [mainImgText, setMainImgText] = useState('Quoc Hung Gay');
            const exportRef = useRef(null);

            // Tự động lưu & tải dữ liệu (LocalStorage)
            useEffect(() => {
                const saved = localStorage.getItem('pcConfigDataV5');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setComponents(parsed.components);
                    setPeripherals(parsed.peripherals);
                    setMainImg(parsed.mainImg);
                    setMainImgText(parsed.mainImgText);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('pcConfigDataV5', JSON.stringify({ components, peripherals, mainImg, mainImgText }));
            }, [components, peripherals, mainImg, mainImgText]);

            // Hàm chuyển chuỗi giá thành số để tính tổng
            const parsePrice = (str) => parseInt(str.toString().replace(/\D/g, '')) || 0;
            const totalCost = components.reduce((acc, curr) => acc + parsePrice(curr.price), 0) +
                              peripherals.reduce((acc, curr) => acc + parsePrice(curr.price), 0);

            // Cập nhật State
            const updateComponent = (id, field, value) => {
                setComponents(components.map(c => c.id === id ? { ...c, [field]: value } : c));
            };
            const updatePeripheral = (id, field, value) => {
                setPeripherals(peripherals.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            // Hàm Xử lý Lỗi Ảnh (Tạo placeholder nếu thiếu ảnh)
            const handleImgError = (e) => {
                if (!e.target.dataset.error) {
                    e.target.dataset.error = true;
                    e.target.src = 'https://placehold.co/100x80/2a134a/FFF?text=Trống';
                }
            };

            // Hàm Xuất Ảnh có bẫy lỗi CORS
            const handleExport = () => {
                html2canvas(exportRef.current, {
                    backgroundColor: '#120921',
                    scale: 2,
                    useCORS: true
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'CauHinhPC.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(err => {
                    alert("⚠️ LỖI TRÌNH DUYỆT CHẶN XUẤT ẢNH!\n\nCách khắc phục:\nTrình duyệt không cho xuất ảnh vì bạn chưa đưa ảnh vào bộ nhớ đệm. Hãy click vào TỪNG BỨC ẢNH trên web (kể cả ảnh linh kiện và ảnh PC lớn) và chọn tải lên tấm ảnh bạn muốn. Sau đó bấm Xuất Ảnh lại sẽ thành công 100%.");
                    console.error("CORS Error:", err);
                });
            };

            return (
                <div className="max-w-[1400px] mx-auto pb-20">
                    <div ref={exportRef} className="flex flex-col lg:flex-row gap-6 p-8 bg-[#120921] rounded-2xl shadow-2xl items-stretch">

                        {/* CỘT TRÁI: Bảng Linh Kiện & Gaming Gear */}
                        <div className="flex-1 flex flex-col gap-5">

                            <div className="text-4xl font-bold text-white neon-text flex items-center gap-3">
                                <span>🎮</span>
                                <input defaultValue="CẤU HÌNH PC GAMING" className="font-bold w-full uppercase bg-transparent" />
                            </div>

                            {/* Bảng Linh Kiện */}
                            <div className="border border-purple-500/50 rounded-xl overflow-hidden bg-[#2a134a]/60 shadow-[0_0_15px_rgba(168,85,247,0.2)]">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-purple-900/60 text-pink-300 border-b border-purple-500/50 uppercase text-[17px]">
                                            <th className="p-3 text-center w-12 border-r border-purple-500/50">#</th>
                                            <th className="p-3 w-[280px] border-r border-purple-500/50">LINH KIỆN</th>
                                            <th className="p-3 border-r border-purple-500/50">MODEL / THÔNG SỐ</th>
                                            <th className="p-3 w-36 text-center">GIÁ (VNĐ)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {components.map((c, idx) => (
                                            <tr key={c.id} className="border-b border-purple-500/30 hover:bg-white/5 transition-colors">
                                                <td className="p-2 text-center font-bold text-xl border-r border-purple-500/30 text-white/80">{idx + 1}</td>
                                                <td className="p-2 border-r border-purple-500/30">
                                                    <div className="flex items-center gap-3">
                                                        <label className="cursor-pointer flex-shrink-0 bg-black/40 p-1 rounded-md border border-purple-500/30 hover:border-purple-400 transition-all">
                                                            <img src={c.img} alt={c.type} className="w-24 h-20 object-cover rounded-md" onError={handleImgError} />
                                                            <input type="file" className="hidden" accept="image/*" onChange={(e) => {
                                                                const file = e.target.files[0];
                                                                if(file) {
                                                                    const r = new FileReader();
                                                                    r.onload = () => updateComponent(c.id, 'img', r.result);
                                                                    r.readAsDataURL(file);
                                                                }
                                                            }} />
                                                        </label>
                                                        <input value={c.type} onChange={(e) => updateComponent(c.id, 'type', e.target.value)} className="font-bold text-white uppercase text-[15px] w-full" />
                                                    </div>
                                                </td>
                                                <td className="p-2 border-r border-purple-500/30">
                                                    <input value={c.name} onChange={(e) => updateComponent(c.id, 'name', e.target.value)} className="text-white font-semibold w-full text-[16px] px-2" />
                                                </td>
                                                <td className="p-2">
                                                    <input value={c.price} onChange={(e) => updateComponent(c.id, 'price', e.target.value)} className="text-yellow-400 font-bold text-right w-full text-lg pr-2" />
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            {/* Dãy Gear / Peripherals */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-2">
                                {peripherals.map(p => (
                                    <div key={p.id} className="border border-purple-500/50 rounded-xl p-3 bg-[#2a134a]/60 shadow-[0_0_10px_rgba(168,85,247,0.2)] flex gap-3 items-center">
                                        <label className="cursor-pointer w-20 h-20 flex-shrink-0 bg-black/40 border border-purple-500/30 rounded-lg flex items-center justify-center hover:border-purple-400 transition-all overflow-hidden">
                                            <img src={p.img} className="w-full h-full object-cover" onError={handleImgError} />
                                            <input type="file" className="hidden" accept="image/*" onChange={(e) => {
                                                const file = e.target.files[0];
                                                if(file) {
                                                    const r = new FileReader();
                                                    r.onload = () => updatePeripheral(p.id, 'img', r.result);
                                                    r.readAsDataURL(file);
                                                }
                                            }}/>
                                        </label>
                                        <div className="flex-1 min-w-0 flex flex-col justify-between h-full">
                                            <input value={p.type} onChange={(e) => updatePeripheral(p.id, 'type', e.target.value)} className="text-pink-300 font-bold text-[13px] w-full uppercase" />
                                            <textarea value={p.name} onChange={(e) => updatePeripheral(p.id, 'name', e.target.value)} rows="2" className="text-white font-semibold w-full text-[14px] bg-transparent border-none resize-none overflow-hidden leading-snug" />
                                            <div className="bg-purple-900/80 rounded-full px-2 py-1 mt-1 border border-purple-500/50">
                                                <input value={p.price} onChange={(e) => updatePeripheral(p.id, 'price', e.target.value)} className="text-yellow-400 font-bold text-center w-full text-[15px]" />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* CỘT PHẢI: Ảnh PC lớn & Tổng Giá */}
                        {/* lg:mt-[76px] đẩy cột này tụt xuống bằng với viền trên của bảng linh kiện */}
                        <div className="w-full lg:w-[480px] flex flex-col gap-6 lg:mt-[180px]">
                          <div className="bg-gradient-to-r from-purple-900 to-indigo-900 border-2 border-purple-500 rounded-full py-3 px-6 shadow-[0_0_15px_rgba(168,85,247,0.3)] shrink-0">
                              <input value={mainImgText} onChange={(e) => setMainImgText(e.target.value)} className="text-yellow-400 font-bold text-[19px] text-center w-full uppercase tracking-wide" />
                          </div>
                            {/* KHUNG ẢNH CỐ ĐỊNH CHIỀU CAO */}
                            {/* Bạn có thể sửa h-[450px] thành số khác nếu muốn cao/thấp hơn */}
                            <div className="relative group w-full h-[700px] border-2 border-purple-500/80 rounded-2xl overflow-hidden shadow-[0_0_35px_rgba(168,85,247,0.35)] bg-black">
                                <div className="absolute inset-0 bg-gradient-to-t from-purple-900/40 via-transparent to-transparent z-10 pointer-events-none"></div>

                                <img src={mainImg} className="absolute inset-0 w-full h-full object-cover object-center transition-transform duration-700 group-hover:scale-105" onError={(e) => {
                                    if(!e.target.dataset.error) {
                                        e.target.dataset.error = true;
                                        e.target.src = 'https://placehold.co/800x1000/120921/FFF?text=Ảnh+Case';
                                    }
                                }} />

                                <label className="absolute inset-0 z-20 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center justify-center cursor-pointer text-white font-bold text-xl backdrop-blur-sm">
                                    <span className="text-4xl mb-2">📸</span>
                                    <span>CLICK ĐỂ ĐỔI ẢNH THỰC TẾ</span>
                                    <input type="file" className="hidden" accept="image/*" onChange={(e) => {
                                        const file = e.target.files[0];
                                        if(file) {
                                            const r = new FileReader();
                                            r.onload = () => setMainImg(r.result);
                                            r.readAsDataURL(file);
                                        }
                                    }}/>
                                </label>
                            </div>

                            {/* NHÓM NÀY ĐƯỢC ÉP XUỐNG ĐÁY BẰNG mt-auto */}
                            <div className="mt-auto flex flex-col gap-6">
                                {/* Chữ mô tả Vỏ Case */}
                                <div className="bg-gradient-to-r from-purple-900 to-indigo-900 border-2 border-purple-500 rounded-full py-3 px-6 shadow-[0_0_15px_rgba(168,85,247,0.3)] shrink-0">
                                    <input value={mainImgText} onChange={(e) => setMainImgText(e.target.value)} className="text-yellow-400 font-bold text-[19px] text-center w-full uppercase tracking-wide" />
                                </div>

                                {/* Box Tổng Tiền */}
                                <div className="border-2 border-purple-500 rounded-2xl p-6 bg-gradient-to-b from-[#3a1a6b] to-[#1a0b2e] shadow-[0_0_30px_rgba(168,85,247,0.3)] text-center flex flex-col items-center justify-center shrink-0">
                                    <div className="flex items-center gap-3 text-2xl font-bold text-white mb-2">
                                        <svg className="w-8 h-8 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                        TỔNG CHI PHÍ
                                    </div>
                                    <div className="text-yellow-400 font-bold text-5xl neon-text tracking-wider mt-2">
                                        {totalCost.toLocaleString('vi-VN')} VNĐ
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    {/* Nút Xuất File */}
                    <div className="fixed bottom-6 right-6 z-50">
                        <button onClick={handleExport} className="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-3 px-6 rounded-full shadow-[0_0_20px_rgba(217,70,239,0.6)] border-2 border-pink-400 transform hover:scale-105 transition-all flex items-center gap-2 text-lg">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Xuất Ảnh Cấu Hình
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
